spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mealplanner}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: true

app:
  seed-demo-data: true

logging:
  level:
    root: INFO
    com.yourname.mealplanner: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
